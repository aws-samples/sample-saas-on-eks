# create namespace tenant-1
apiVersion: v1
kind: Namespace
metadata:
  name: tenant-1
---
apiVersion: kro.run/v1alpha1
kind: TenantBasicPackage
metadata:
  name: tenant-1
  namespace: tenant-1
spec:
  # Tenant configuration
  name: tenant-1
  image: nginx:latest
  replicas: 2
  
  # S3 bucket configuration for this tenant
  # Note: Bucket names must be globally unique
  bucketName: tenant-1-bucket-unique-12345
  
  # Port configuration
  containerPort: 80
  servicePort: 80
