apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: gaming-application
  namespace: default
spec:
  schema:
    apiVersion: v1alpha1
    kind: GamingApplication
    group: kro.run
    spec:
      # Tenant identifier
      tenantId: string | required=true
      # Tenant display name
      tenantName: string | required=true
      # Tenant tier
      tier: string | required=true
      # Application version to deploy
      version: string | default="latest"
      # Container image
      image: string | required=true
      # Number of replicas
      replicas: integer | default=1
      # Container port
      containerPort: integer | default=8080
      # Service port
      servicePort: integer | default=80
      # Resource limits
      resources: object
      # Environment variables
      env: "[]EnvVar"
      # NodePool - shared or tenant-specific
      nodePool: string | required=true
      # ALB scheme - internet-facing or internal
      albScheme: string | default="internet-facing" enum="internet-facing,internal"

    types:
      EnvVar:
        name: string | required=true
        value: string

  resources:
    # ConfigMap for application configuration
    - id: configmap
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: ${schema.metadata.name}-config
          namespace: ${schema.metadata.namespace}
          labels:
            app: ${schema.metadata.name}
            tenant-id: ${schema.spec.tenantId}
            tenant-tier: ${schema.spec.tier}
            managed-by: kro
        data:
          TENANT_ID: ${schema.spec.tenantId}
          TENANT_NAME: ${schema.spec.tenantName}
          TENANT_TIER: ${schema.spec.tier}
          PORT: ${string(schema.spec.containerPort)}

    # Deployment for the gaming application
    - id: deployment
      readyWhen:
        - ${deployment.status.availableReplicas > 0}
        - ${deployment.status.conditions.exists(c, c.type == "Available" && c.status == "True")}
      template:
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: ${schema.metadata.name}
          namespace: ${schema.metadata.namespace}
          labels:
            app: ${schema.metadata.name}
            tenant-id: ${schema.spec.tenantId}
            tenant-tier: ${schema.spec.tier}
            managed-by: kro
        spec:
          replicas: ${schema.spec.replicas}
          selector:
            matchLabels:
              app: ${schema.metadata.name}
              tenant-id: ${schema.spec.tenantId}
          template:
            metadata:
              labels:
                app: ${schema.metadata.name}
                tenant-id: ${schema.spec.tenantId}
                tenant-tier: ${schema.spec.tier}
            spec:
              serviceAccountName: ${schema.spec.tenantId}-sa
              containers:
                - name: gaming-app
                  image: ${schema.spec.image}:${schema.spec.version}
                  ports:
                    - containerPort: ${schema.spec.containerPort}
                      name: http
                      protocol: TCP
                  envFrom:
                    - configMapRef:
                        name: ${schema.metadata.name}-config
                  env: ${schema.spec.env}
                  resources: ${schema.spec.resources}
                  securityContext:
                    allowPrivilegeEscalation: false
                    runAsNonRoot: true
                    runAsUser: 1000
                    capabilities:
                      drop: ["ALL"]
                    seccompProfile:
                      type: RuntimeDefault
                  livenessProbe:
                    httpGet:
                      path: /health
                      port: http
                    initialDelaySeconds: 30
                    periodSeconds: 10
                    timeoutSeconds: 5
                    failureThreshold: 3
                  readinessProbe:
                    httpGet:
                      path: /health
                      port: http
                    initialDelaySeconds: 10
                    periodSeconds: 5
                    timeoutSeconds: 3
                    failureThreshold: 3
                  volumeMounts:
                    - mountPath: /var/run/secrets/pods.eks.amazonaws.com/serviceaccount
                      name: eks-pod-identity-token
                      readOnly: true
              volumes:
                - name: eks-pod-identity-token
                  projected:
                    defaultMode: 420
                    sources:
                      - serviceAccountToken:
                          audience: pods.eks.amazonaws.com
                          expirationSeconds: 80742
                          path: eks-pod-identity-token
              nodeSelector:
                karpenter.sh/nodepool: ${schema.spec.nodePool}
              tolerations:
                - key: "tenant-pool"
                  operator: "Equal"
                  value: ${schema.spec.nodePool}
                  effect: "NoSchedule"

    # Service for the gaming application
    - id: service
      template:
        apiVersion: v1
        kind: Service
        metadata:
          name: ${schema.metadata.name}
          namespace: ${schema.metadata.namespace}
          labels:
            app: ${schema.metadata.name}
            tenant-id: ${schema.spec.tenantId}
            tenant-tier: ${schema.spec.tier}
            managed-by: kro
        spec:
          type: ClusterIP
          selector:
            app: ${schema.metadata.name}
            tenant-id: ${schema.spec.tenantId}
          ports:
            - port: ${schema.spec.servicePort}
              targetPort: ${schema.spec.containerPort}
              protocol: TCP
              name: http

    # Ingress for external access
    - id: ingress
      template:
        apiVersion: networking.k8s.io/v1
        kind: Ingress
        metadata:
          name: ${schema.metadata.name}
          namespace: ${schema.metadata.namespace}
          labels:
            app: ${schema.metadata.name}
            tenant-id: ${schema.spec.tenantId}
            tenant-tier: ${schema.spec.tier}
            managed-by: kro
          annotations:
            alb.ingress.kubernetes.io/scheme: ${schema.spec.albScheme}
            alb.ingress.kubernetes.io/target-type: ip
            alb.ingress.kubernetes.io/tags: TenantId=${schema.spec.tenantId},TenantTier=${schema.spec.tier}
        spec:
          ingressClassName: alb
          rules:
            - http:
                paths:
                  - path: /
                    pathType: Prefix
                    backend:
                      service:
                        name: ${schema.metadata.name}
                        port:
                          number: ${schema.spec.servicePort}

    # HorizontalPodAutoscaler for Pro tier
    - id: hpa
      includeWhen:
        - ${schema.spec.tier == "pro"}
      template:
        apiVersion: autoscaling/v2
        kind: HorizontalPodAutoscaler
        metadata:
          name: ${schema.metadata.name}
          namespace: ${schema.metadata.namespace}
          labels:
            app: ${schema.metadata.name}
            tenant-id: ${schema.spec.tenantId}
            tenant-tier: ${schema.spec.tier}
            managed-by: kro
        spec:
          scaleTargetRef:
            apiVersion: apps/v1
            kind: Deployment
            name: ${schema.metadata.name}
          minReplicas: ${schema.spec.replicas}
          maxReplicas: 10
          metrics:
            - type: Resource
              resource:
                name: cpu
                target:
                  type: Utilization
                  averageUtilization: 70
            - type: Resource
              resource:
                name: memory
                target:
                  type: Utilization
                  averageUtilization: 80
