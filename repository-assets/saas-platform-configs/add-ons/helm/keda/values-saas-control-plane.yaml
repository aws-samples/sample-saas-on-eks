operator:
  name: keda-operator
  replicaCount: 1

metricsServer:
  name: keda-metrics-apiserver
  replicaCount: 1

webhooks:
  name: keda-admission-webhooks
  replicaCount: 1

serviceAccount:
  operator:
    name: keda-operator
  metricsServer:
    name: keda-metrics-server
  webhooks:
    name: keda-webhooks

# Control plane specific configuration
resources:
  operator:
    limits:
      cpu: 1000m
      memory: 1000Mi
    requests:
      cpu: 100m
      memory: 100Mi