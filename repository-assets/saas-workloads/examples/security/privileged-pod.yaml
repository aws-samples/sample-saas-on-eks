# Teaching artifact — this pod is INTENDED TO FAIL.
# Applying it to a tenant namespace enforces the Pod Security Standard
# "baseline" level, which rejects privileged containers.
# Used in Module 400, page 500 (Runtime Guardrails).
apiVersion: v1
kind: Pod
metadata:
  name: privileged-demo
spec:
  containers:
    - name: privileged-demo
      image: public.ecr.aws/docker/library/busybox:1.36
      command: ["sleep", "3600"]
      securityContext:
        privileged: true
