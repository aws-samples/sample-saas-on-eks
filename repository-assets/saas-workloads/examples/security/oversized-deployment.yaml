# Teaching artifact — this Deployment is INTENDED TO FAIL.
# The pod requests 2 CPU, which exceeds the Basic tier ResourceQuota
# limit of 500m requests.cpu. The Deployment object is created but
# the ReplicaSet controller cannot create pods.
# Used in Module 400, page 500 (Runtime Guardrails).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oversized-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oversized-demo
  template:
    metadata:
      labels:
        app: oversized-demo
    spec:
      containers:
        - name: oversized-demo
          image: public.ecr.aws/docker/library/busybox:1.36
          command: ["sleep", "3600"]
          resources:
            requests:
              cpu: "2"
              memory: "256Mi"
            limits:
              cpu: "2"
              memory: "256Mi"
