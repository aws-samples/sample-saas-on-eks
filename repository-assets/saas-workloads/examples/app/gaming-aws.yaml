# Gaming application — integrated with AWS DynamoDB and S3 via ACK + Pod Identity
apiVersion: v1
kind: Namespace
metadata:
  name: gaming
  labels:
    app: gaming-app
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gaming-app-sa
  namespace: gaming
  labels:
    app: gaming-app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gaming-app
  namespace: gaming
  labels:
    app: gaming-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gaming-app
  template:
    metadata:
      labels:
        app: gaming-app
    spec:
      serviceAccountName: gaming-app-sa
      containers:
        - name: gaming-app
          image: ${GAMING_APP_IMAGE}
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          env:
            # Application settings
            - name: PORT
              value: "8080"
            - name: NODE_ENV
              value: "development"
            - name: AWS_REGION
              value: "${AWS_REGION}"

            # AWS resources created via ACK — switches the app off mock mode
            - name: DYNAMODB_TABLE
              value: "${DYNAMODB_TABLE_NAME}"
            - name: S3_BUCKET
              value: "${S3_BUCKET_NAME}"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: gaming-app
  namespace: gaming
  labels:
    app: gaming-app
spec:
  type: ClusterIP
  selector:
    app: gaming-app
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
      name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gaming-app
  namespace: gaming
  labels:
    app: gaming-app
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gaming-app
                port:
                  number: 80
