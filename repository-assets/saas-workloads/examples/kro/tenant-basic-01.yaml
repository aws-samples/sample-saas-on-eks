# Tenant: tenant-001 (Basic Tier)
---
apiVersion: kro.run/v1alpha1
kind: Tenant
metadata:
  name: tenant-001
  labels:
    tenant-id: tenant-001
    tenant-tier: basic
    managed-by: kro
spec:
  # Tenant identification
  tenantId: tenant-001
  tenantName: "Tenant Basic 001"

  # Tier configuration
  tier: basic
  version: "latest"

  # Shared Resources Pool
  tenantPool: "pool-resources-001"
